name: Beta workflow feedback
description: Report whether Reup helped you find, triage, or resume Claude Code work.
title: '[beta] '
labels:
  - feedback
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing Reup. Describe the workflow, not the contents of your work.
        Do not include transcripts, session titles, repository names, local paths, credentials, or screenshots containing private code.
  - type: dropdown
    id: workflow
    attributes:
      label: Workflow
      description: What were you trying to do?
      options:
        - Find an older session across projects
        - Identify a live session that needed attention
        - Decide whether and where to resume a session
        - Install, upgrade, or remove Reup
        - Another Reup workflow
    validations:
      required: true
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Reup and Claude Code versions
      description: Run `reup --version` and `claude --version`. Version numbers only.
      placeholder: 'Reup 0.x.y; Claude Code 2.x.y'
    validations:
      required: true
  - type: dropdown
    id: session-scale
    attributes:
      label: Approximate local session scale
      options:
        - Fewer than 10 sessions
        - 10-29 sessions
        - 30-99 sessions
        - 100 or more sessions
        - Prefer not to say
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: What happened?
      description: Include the path you took through Reup and whether you completed the task.
      placeholder: 'I opened..., searched by..., and found/resumed...'
    validations:
      required: true
  - type: input
    id: elapsed-time
    attributes:
      label: Approximate time to complete the task
      placeholder: 'About 10 seconds'
  - type: textarea
    id: confidence
    attributes:
      label: What was clear or unclear?
      description: Especially note any live state, warning, or resume advice you did not trust.
  - type: textarea
    id: native-comparison
    attributes:
      label: How did this compare with Claude Code's built-in workflow?
      description: If practical, say what you would otherwise have used and which path was faster or clearer.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed transcripts, credentials, private code, repository names, session titles, and local paths.
          required: true
