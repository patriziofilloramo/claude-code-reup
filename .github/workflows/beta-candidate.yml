name: Beta Candidate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beta-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-candidate:
    name: Build verified beta candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install extension dependencies
        run: npm ci --prefix extension

      - name: Build and verify release candidate
        run: xvfb-run --auto-servernum npm run release:local

      - name: Upload candidate bundle
        uses: actions/upload-artifact@v4
        with:
          name: reup-beta-candidate-${{ github.sha }}
          path: release/reup-v*/
          if-no-files-found: error
          retention-days: 14
