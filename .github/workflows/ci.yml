name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install extension dependencies
        run: npm ci --prefix extension

      - name: Check version sync
        run: npm run check:version

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Build VS Code extension
        run: npm run build:extension

      - name: Check product version policy
        if: runner.os == 'Linux'
        env:
          PRODUCT_VERSION_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/check-extension-version.mjs

      - name: Test
        run: npm test

      - name: Package VS Code extension
        run: npm run package:extension

      - name: Verify packaged VS Code extension
        run: npm run release:extension:check

      - name: Verify npm package dry-run
        if: runner.os == 'Linux'
        run: npm run release:package:check
